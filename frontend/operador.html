<!-- Adaptador de entrada (frontend): pantalla protegida del rol OPERADOR
     (equivalente a kitchan/operador). El guard corre en un <script>
     bloqueante dentro de <head>, ANTES de que el navegador parsee/pinte
     el <body>, para que un rol incorrecto o sesión inexistente redirija
     sin llegar a mostrar nada de esta pantalla. -->
<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Kitchan - Operador</title>
    <script src="auth.js"></script>
    <script>
      protegerRuta("OPERADOR");
    </script>
  </head>
  <body>
    <h1>Panel de Operador</h1>
    <p>Bienvenido. Esta es la pantalla protegida de operador.</p>
    <button id="btn-logout">Cerrar sesión</button>

    <script>
      document.getElementById("btn-logout").addEventListener("click", function () {
        cerrarSesion();
        window.location.replace("login-operador.html");
      });
    </script>
  </body>
</html>

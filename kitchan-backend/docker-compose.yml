version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: kitchan_postgres
    restart: always
    environment:
      POSTGRES_USER: kitchan_user
      POSTGRES_PASSWORD: kitchan_password
      POSTGRES_DB: kitchan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kitchan_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
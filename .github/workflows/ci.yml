name: Pipeline de Calidad KITCHAN

on:
  pull_request:
    branches: [ "develop", "main" ]
  push:
    branches: [ "develop", "main" ]

jobs:
  verificacion-codigo:
    runs-on: ubuntu-latest
    
    # Indicamos que todos los comandos corran dentro de la subcarpeta del backend
    defaults:
      run:
        working-directory: kitchan-backend

    steps:
    - name: Clonar el código
      uses: actions/checkout@v3

    - name: Configurar entorno Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Instalar herramientas de calidad y dependencias
      run: |
        python -m pip install --upgrade pip
        pip install "pydantic[email]" black flake8 mypy bandit pytest pytest-asyncio
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 1. Formateador de Código (Black)
      run: black --check .

    - name: 2. Análisis de Sintaxis (Flake8)
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv

    - name: 3. Análisis de Seguridad (Bandit)
      run: bandit -r src/ -ll

    - name: 4. Ejecución de Pruebas Unitarias (Pytest)
      env:
        # Valores ficticios solo para las pruebas: el .env real no se versiona.
        DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        SECRET_KEY: "clave-solo-para-pruebas"
        ALGORITHM: "HS256"
        ACCESS_TOKEN_EXPIRE_MINUTES: "30"
        REDIS_URL: "redis://localhost:6379/0"
      run: |
        export PYTHONPATH=.
        pytest tests/